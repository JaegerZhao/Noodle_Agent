name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/noodle/pyproject.toml

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -e "./services/noodle[dev]"

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Check release source hygiene
        run: npm run check:release

      - name: Test Harness tools and provider
        run: npm test

      - name: Lint Python
        run: python -m ruff check services/noodle/src services/noodle/tests

      - name: Test Python domain service
        run: >-
          python -m pytest services/noodle/tests
          -p no:cacheprovider
          --basetemp "${{ runner.temp }}/noodle-pytest"

      - name: Validate Docker Compose
        if: runner.os == 'Linux'
        run: docker compose config --quiet

      - name: Build plugin and Python wheel
        run: |
          npm run build
          python -m pip wheel --no-deps ./services/noodle --wheel-dir .runtime/wheels

      - name: Isolated API Worker Harness delivery check (synthetic providers)
        run: python scripts/delivery-check.py

      - name: Build deployment images
        if: runner.os == 'Linux'
        run: docker compose build
