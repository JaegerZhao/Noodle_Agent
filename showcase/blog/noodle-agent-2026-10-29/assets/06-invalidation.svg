<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 552" role="img" aria-labelledby="06-invalidation-title 06-invalidation-desc" id="d-06-invalidation-root"><title id="06-invalidation-title">删除、索引失效与恢复</title><desc id="06-invalidation-desc">删除、索引失效与恢复的组件、数据依赖和执行方向。</desc><defs>
      <style>#d-06-invalidation-root .diagram-container { width:100%;overflow-x:auto }
      #d-06-invalidation-root .diagram-container { overflow:visible }</style><marker id="d-06-invalidation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="d-06-invalidation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker><marker id="d-06-invalidation-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs><rect width="896" height="552" fill="#ffffff"/><path d="M 264,84 L 336,84" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-invalidation-arrow)"/><path d="M 560,84 L 632,84" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-invalidation-arrow)"/><path d="M 744,128 L 744,232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-invalidation-arrow)"/><path d="M 560,108 L 584,108 Q 592,108 592,116 L 592,204 Q 592,212 600,212 L 676,212 Q 684,212 684,220 L 684,232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-invalidation-arrow)"/><path d="M 632,276 L 560,276" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-invalidation-arrow)"/><path d="M 336,276 L 264,276" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-invalidation-arrow)"/><path d="M 152,424 L 152,380 Q 152,372 160,372 L 296,372 Q 304,372 304,364 L 304,172 Q 304,164 312,164 L 440,164 Q 448,164 448,156 L 448,128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-invalidation-arrow)"/><rect x="40" y="40" width="224" height="88" rx="6" fill="#ffffff"/><rect x="40" y="40" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="152.0" y="90.0" fill="#2d3142" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="600" text-anchor="middle">删除、撤回或替换来源</text><rect x="336" y="40" width="224" height="88" rx="6" fill="#ffffff"/><rect x="336" y="40" width="224" height="88" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.06"/><text x="448.0" y="80.0" fill="#2d3142" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="600" text-anchor="middle">更新当前有效资格</text><text x="448.0" y="102.0" fill="#4f5d75" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">撤回时先过滤；恢复时重新核验</text><rect x="632" y="40" width="224" height="88" rx="6" fill="#ffffff"/><rect x="632" y="40" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="744.0" y="80.0" fill="#2d3142" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="600" text-anchor="middle">按贡献依赖重整 Concept</text><text x="744.0" y="102.0" fill="#4f5d75" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">重算正文、媒体与关系支持</text><rect x="632" y="232" width="224" height="88" rx="6" fill="#ffffff"/><rect x="632" y="232" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="744.0" y="272.0" fill="#2d3142" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="600" text-anchor="middle">请求索引维护</text><text x="744.0" y="294.0" fill="#4f5d75" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">合并待处理索引需求</text><rect x="336" y="232" width="224" height="88" rx="6" fill="#ffffff"/><rect x="336" y="232" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="448.0" y="272.0" fill="#2d3142" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="600" text-anchor="middle">重建当前有效 Chunk 集合</text><text x="448.0" y="294.0" fill="#4f5d75" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">失效 Chunk 不进入新索引代</text><rect x="40" y="232" width="224" height="88" rx="6" fill="#ffffff"/><rect x="40" y="232" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="152.0" y="272.0" fill="#2d3142" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="600" text-anchor="middle">校验并激活新索引代</text><text x="152.0" y="294.0" fill="#4f5d75" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">旧向量可留作历史，查询不再使用</text><rect x="40" y="424" width="224" height="88" rx="6" fill="#ffffff"/><rect x="40" y="424" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="152.0" y="464.0" fill="#2d3142" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="600" text-anchor="middle">恢复来源或笔记</text><text x="152.0" y="486.0" fill="#4f5d75" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">重算依赖并重新索引</text></svg>
