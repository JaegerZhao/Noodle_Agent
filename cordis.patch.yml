# Installable DeepSeek Harness bundle layer. When installed with
# `dsh plugin --profile noodle add .`, the package name resolves this plugin.
- insert:
    - id: noodle-domain-agent
      name: '@noodle/agent'
      config:
        baseUrl: !!js process.env.NOODLE_API_BASE_URL || 'http://127.0.0.1:8000'
        apiPrefix: !!js process.env.NOODLE_API_PREFIX || '/internal/v1'
        timeoutMs: !!js Number(process.env.NOODLE_API_TIMEOUT_MS || 120000)
        maxBodyChars: 12000
        workspacePath: !!js process.env.NOODLE_HARNESS_WORKSPACE || process.cwd()
        workspaceTitle: Noodle Agent
